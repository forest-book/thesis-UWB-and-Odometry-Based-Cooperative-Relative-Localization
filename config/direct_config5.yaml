# シミュレーション設定ファイル
# 直接推定できるUAV数: 5機すべて
# 隣接機は1機

# シミュレーション時間設定
DURATION: 300  # シミュレーション時間 [秒]
T: 0.02        # サンプリング周期 [秒]

# 推定アルゴリズム設定
GAMMA: 0.06    # ゲイン γ
TARGET_ID: 1   # 推定目標UAV ID

# シナリオ設定
# 選択肢: CONTINUOUS, SUDDEN_TURN
EVENT: CONTINUOUS

# UAV初期位置 [x, y] (m)
INITIAL_POSITIONS:
  1: [0, 0]
  2: [2, -30]
  3: [20, -15]
  4: [-20, 8]
  5: [-14, 8]
  6: [-10, -30]

# 隣接関係設定
NEIGHBORS:
  1: []          # UAV1の隣接機(推定対象のため無し)
  2: [1, 6]         # UAV2の隣接機
  3: [1, 2]   # UAV3の隣接機
  4: [1, 3]         # UAV4の隣接機
  5: [1, 4]      # UAV5の隣接機
  6: [1, 5]         # UAV6の隣接機

# UAVが描く軌道(論文記載の速度式を基に設定)
UAV_TRAJECTORIES:
  1:
    type: "formula"
    vx: "np.cos(k / 3)"
    vy: "-5/3 * np.sin(k / 3)"
  2:
    type: "formula"
    vx: "-2 * np.sin(k)"
    vy: "2 * np.cos(k)"
  3:
    type: "formula"
    vx: "np.cos(k/5) - np.sin(k/5) * np.cos(k)"
    vy: "np.sin(k/5) + np.cos(k/5) * np.cos(k)"
  4:
    type: "formula"
    vx: "-3 * np.sin(k)"
    vy: "3 * np.cos(k)"
  5:
    type: "formula"
    vx: "1/6"
    vy: "0"
  6:
    type: "formula"
    vx: "-10/3 * np.sin(k/3)"
    vy: "5/3 * np.cos(k/3)"

# ノイズパラメータ
NOISE:
  enabled: true
  delta_bar: 0.5   # 速度ノイズ幅 [m/s]
  dist_bound: 0.05 # 距離ノイズ幅 [m]
  initialization_bound: 25  # 初期推定ノイズ幅 [m]

# フィルタ設定
FILTER:
  enabled: false   # フィルタの有効/無効
  alpha: 0.8      # EMA係数（0〜1、小さいほど平滑化が強い。この設定値0.8は平滑化弱めで応答速度が速い）
